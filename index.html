<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBOR-LINGUO</title>
    <link rel="icon" href="/images/beaver.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --bg: #0f172a;
            --bg-light: #1e293b;
            --card: #1e293b;
            --card-hover: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        [data-theme="light"] {
            --bg: #f8fafc;
            --bg-light: #e2e8f0;
            --card: #ffffff;
            --card-hover: #f1f5f9;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .fade-in { animation: fadeIn 0.5s ease; }
        .slide-in { animation: slideIn 0.4s ease; }
        .shake { animation: shake 0.4s ease; }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--card);
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.5rem;
            font-weight: 800;
            cursor: pointer;
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }

        .stats {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-light);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        .stat .val {
            color: var(--warning);
            font-size: 1.1rem;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--bg-light);
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            background: var(--card-hover);
        }

        .icon-btn img {
            width: 32px;
            height: 32px;
        }

        .lang-selector {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 16px;
            background: var(--card);
            border-radius: 16px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        .lang-btn {
            padding: 12px 20px;
            background: var(--bg-light);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .lang-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .home-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-sm);
        }

        .home-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }

        .home-card img {
            width: 100px;
            height: 100px;
            margin-bottom: 16px;
        }

        .home-card h3 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .home-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .path-container {
            position: relative;
            padding: 40px 20px;
        }

        .path-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .path-node {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--card);
            border: 4px solid var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 40px auto;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow-sm);
            z-index: 1;
        }

        .path-node:hover:not(.locked) {
            transform: scale(1.15);
            box-shadow: var(--shadow);
        }

        .path-node.locked {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: var(--border);
        }

        .path-node.done {
            background: var(--success);
            border-color: var(--success);
        }

        .path-label {
            position: absolute;
            top: 90px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            text-align: center;
            width: 200px;
        }

        .lesson-header {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 30px 0;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .word-item {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .word-item:hover {
            border-color: var(--primary);
            transform: translateX(5px);
        }

        .word-item .sr {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .word-item .ru {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grammar-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .grammar-box h3 {
            color: var(--primary);
            font-size: 1.4rem;
            margin-bottom: 16px;
        }

        .grammar-box p {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        .quiz-option {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .quiz-option:hover:not(.disabled) {
            border-color: var(--primary);
            transform: translateX(10px);
        }

        .quiz-option.correct {
            background: var(--success);
            border-color: var(--success);
            color: white;
            animation: pulse 0.3s;
        }

        .quiz-option.wrong {
            background: var(--error);
            border-color: var(--error);
            color: white;
            animation: shake 0.4s;
        }

        .quiz-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn {
            padding: 16px 32px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 20px;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-secondary {
            background: var(--card);
            border: 2px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
        }

        .auth-container {
            max-width: 450px;
            margin: 100px auto;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--shadow);
        }

        .auth-container h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-container p {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            background: var(--bg-light);
            border: 2px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            text-align: center;
            transition: all 0.2s;
        }

        .auth-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .auth-tab:hover:not(.active) {
            border-color: var(--primary);
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            background: var(--bg-light);
            color: var(--text);
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .audio-btn {
            background: var(--primary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: all 0.2s;
        }

        .audio-btn:hover {
            transform: scale(1.1);
        }

        .success-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .success-screen .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .back-btn {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            border-color: var(--primary);
        }

        @media (max-width: 768px) {
            .home-grid {
                grid-template-columns: 1fr;
            }
            
            .topbar {
                flex-direction: column;
                gap: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        const COURSES = {
            sr: { flag: "🇷🇸", name: "Сербский" },
            tr: { flag: "🇹🇷", name: "Турецкий" },
            pl: { flag: "🇵🇱", name: "Польский" },
            be: { flag: "🇧🇾", name: "Белорусский" },
            kk: { flag: "🇰🇿", name: "Казахский" },
            tt: { flag: "🏳️", name: "Татарский" }
        };

        let state = {
            screen: 'auth',
            user: null,
            theme: 'dark',
            course: 'sr',
            xp: 0,
            streak: 0,
            progress: {},
            alpha: {},
            medals: [],
            unit: null,
            step: 'words',
            letter: null,
            qi: 0,
            loading: false,
            data: null,
            authMode: 'login'
        };

        const el = (tag, attrs = {}, children = []) => {
            const e = document.createElement(tag);
            for (let k in attrs) {
                if (k === 'class') e.className = attrs[k];
                else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
                else e.setAttribute(k, attrs[k]);
            }
            (Array.isArray(children) ? children : [children]).forEach(c => {
                if (c != null && c !== false) {
                    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                }
            });
            return e;
        };

        function save() {
            localStorage.setItem('bobor_v3', JSON.stringify({
                user: state.user,
                theme: state.theme,
                xp: state.xp,
                streak: state.streak,
                course: state.course,
                progress: Object.fromEntries(Object.entries(state.progress).map(([k, v]) => [k, [...v]])),
                alpha: Object.fromEntries(Object.entries(state.alpha).map(([k, v]) => [k, [...v]])),
                medals: state.medals
            }));
        }

        function load() {
            try {
                const d = JSON.parse(localStorage.getItem('bobor_v3'));
                if (d) {
                    state.user = d.user;
                    state.theme = d.theme || 'dark';
                    state.xp = d.xp || 0;
                    state.streak = d.streak || 0;
                    state.course = d.course || 'sr';
                    state.medals = d.medals || [];
                    state.progress = Object.fromEntries(Object.entries(d.progress || {}).map(([k, v]) => [k, new Set(v)]));
                    state.alpha = Object.fromEntries(Object.entries(d.alpha || {}).map(([k, v]) => [k, new Set(v)]));
                    if (state.user) state.screen = 'home';
                }
            } catch (e) {}
        }

        async function loadCourse() {
            state.loading = true;
            render();
            try {
                const r = await fetch(`/data/${state.course}.json`);
                state.data = await r.json();
            } catch (e) {
                state.data = { name: "Ошибка", units: [] };
            }
            state.loading = false;
            render();
        }

        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';
            document.documentElement.setAttribute('data-theme', state.theme);

            if (!state.user && state.screen !== 'auth') state.screen = 'auth';

            if (state.screen === 'auth') renderAuth(root);
            else if (state.screen === 'home') renderHome(root);
            else if (state.screen === 'learn') renderLearn(root);
            else if (state.screen === 'lesson') renderLesson(root);
            else if (state.screen === 'library') renderLibrary(root);
            else if (state.screen === 'shop') renderShop(root);
            else if (state.screen === 'ranked') renderRanked(root);
            else if (state.screen === 'settings') renderSettings(root);
        }

        function renderAuth(root) {
            const container = el('div', { class: 'auth-container fade-in' });
            
            container.appendChild(el('h1', {}, 'BOBOR-LINGUO'));
            container.appendChild(el('p', {}, 'Учи языки с бобром'));

            const tabs = el('div', { class: 'auth-tabs' });
            const loginTab = el('div', { 
                class: 'auth-tab' + (state.authMode === 'login' ? ' active' : ''),
                onclick: () => { state.authMode = 'login'; render(); }
            }, 'Вход');
            const registerTab = el('div', { 
                class: 'auth-tab' + (state.authMode === 'register' ? ' active' : ''),
                onclick: () => { state.authMode = 'register'; render(); }
            }, 'Регистрация');
            tabs.appendChild(loginTab);
            tabs.appendChild(registerTab);
            container.appendChild(tabs);

            const form = el('form', {
                onsubmit: async (e) => {
                    e.preventDefault();
                    const email = e.target.email.value.trim();
                    const password = e.target.password.value.trim();
                    
                    if (!email || !password) {
                        alert('Заполни все поля');
                        return;
                    }

                    try {
                        const endpoint = state.authMode === 'login' ? '/api/login' : '/api/register';
                        const res = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email, password })
                        });
                        const data = await res.json();

                        if (data.success) {
                            if (state.authMode === 'register') {
                                alert('Аккаунт создан! Теперь войди');
                                state.authMode = 'login';
                                render();
                            } else {
                                state.user = data.user;
                                state.screen = 'home';
                                save();
                                render();
                            }
                        } else {
                            alert(data.error || 'Ошибка');
                        }
                    } catch (e) {
                        alert('Ошибка соединения');
                    }
                }
            });

            form.appendChild(el('input', { 
                type: 'email', 
                name: 'email', 
                placeholder: 'Email',
                required: true
            }));
            form.appendChild(el('input', { 
                type: 'password', 
                name: 'password', 
                placeholder: 'Пароль',
                required: true
            }));
            form.appendChild(el('button', { 
                type: 'submit', 
                class: 'btn btn-primary' 
            }, state.authMode === 'login' ? 'Войти' : 'Создать аккаунт'));

            container.appendChild(form);
            root.appendChild(container);
        }

        function renderHome(root) {
            const app = el('div', { class: 'app fade-in' });

            const topbar = el('div', { class: 'topbar' });
            const brand = el('div', { 
                class: 'brand',
                onclick: () => { state.screen = 'home'; render(); }
            });
            brand.appendChild(el('img', { src: '/images/beaver.png' }));
            brand.appendChild(el('span', {}, 'BOBOR'));
            topbar.appendChild(brand);

            const stats = el('div', { class: 'stats' });
            stats.appendChild(el('div', { class: 'stat' }, ['🔥 ', el('span', { class: 'val' }, state.streak)]));
            stats.appendChild(el('div', { class: 'stat' }, ['⚡ ', el('span', { class: 'val' }, state.xp)]));
            const settingsBtn = el('div', { 
                class: 'icon-btn',
                onclick: () => { state.screen = 'settings'; render(); }
            });
            settingsBtn.appendChild(el('img', { src: '/images/settings.png' }));
            stats.appendChild(settingsBtn);
            topbar.appendChild(stats);
            app.appendChild(topbar);

            const langSelector = el('div', { class: 'lang-selector' });
            Object.keys(COURSES).forEach(code => {
                const btn = el('div', {
                    class: 'lang-btn' + (state.course === code ? ' active' : ''),
                    onclick: () => { state.course = code; save(); render(); }
                });
                btn.appendChild(document.createTextNode(COURSES[code].flag + ' ' + COURSES[code].name));
                langSelector.appendChild(btn);
            });
            app.appendChild(langSelector);

            const welcome = el('h1', { 
                class: 'slide-in',
                style: 'font-size: 2rem; margin-bottom: 30px;'
            }, `Привет, ${state.user?.email?.split('@')[0] || 'друг'}! 👋`);
            app.appendChild(welcome);

            const grid = el('div', { class: 'home-grid' });
            
            const cards = [
                { id: 'learn', icon: '/images/learn.png', title: 'Обучение', desc: 'Начни путь' },
                { id: 'library', icon: '📚', title: 'Библиотека', desc: 'Пройденные уроки' },
                { id: 'shop', icon: '/images/shop.png', title: 'Магазин', desc: 'Медали и награды' },
                { id: 'ranked', icon: '/images/ranked.png', title: 'Ранкед', desc: 'Таблица лидеров' }
            ];

            cards.forEach((card, i) => {
                const cardEl = el('div', { 
                    class: 'home-card slide-in',
                    style: `animation-delay: ${i * 0.1}s`,
                    onclick: () => {
                        state.screen = card.id;
                        if (card.id === 'learn' || card.id === 'library') {
                            loadCourse();
                        } else {
                            render();
                        }
                    }
                });
                
                if (card.icon.startsWith('/')) {
                    cardEl.appendChild(el('img', { src: card.icon }));
                } else {
                    cardEl.appendChild(el('div', { style: 'font-size: 4rem; margin-bottom: 16px;' }, card.icon));
                }
                
                cardEl.appendChild(el('h3', {}, card.title));
                cardEl.appendChild(el('p', {}, card.desc));
                grid.appendChild(cardEl);
            });

            app.appendChild(grid);
            root.appendChild(app);
        }

        function renderLearn(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'home'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            if (state.loading) {
                app.appendChild(el('p', { 
                    style: 'text-align: center; font-size: 1.2rem; margin-top: 50px;' 
                }, 'Загрузка...'));
                root.appendChild(app);
                return;
            }

            if (!state.data) {
                app.appendChild(el('p', { 
                    style: 'text-align: center; font-size: 1.2rem; margin-top: 50px;' 
                }, 'Ошибка загрузки курса'));
                root.appendChild(app);
                return;
            }

            app.appendChild(el('h1', { 
                style: 'text-align: center; font-size: 2rem; margin-bottom: 30px;' 
            }, state.data.name));

            const pathContainer = el('div', { class: 'path-container' });
            pathContainer.appendChild(el('div', { class: 'path-line' }));

            const prog = state.progress[state.course] || new Set();
            let prevDone = true;

            state.data.units.forEach((unit, i) => {
                const done = prog.has(unit.id);
                const locked = !prevDone;
                
                const node = el('div', {
                    class: 'path-node' + (locked ? ' locked' : '') + (done ? ' done' : ''),
                    onclick: () => {
                        if (locked) return;
                        state.unit = unit;
                        state.step = unit.alphabet ? 'alpha_grid' : 'words';
                        state.qi = 0;
                        state.letter = null;
                        state.screen = 'lesson';
                        render();
                    }
                });
                
                node.appendChild(el('span', {}, done ? '✓' : (locked ? '🔒' : '▶')));
                
                const label = el('div', { class: 'path-label' }, unit.title);
                node.appendChild(label);
                
                pathContainer.appendChild(node);
                prevDone = done;
            });

            app.appendChild(pathContainer);
            root.appendChild(app);
        }

        function renderLesson(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'learn'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            const unit = state.unit;
            if (!unit) return;

            if (state.step === 'alpha_grid') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Алфавит'));
                
                const grid = el('div', { 
                    class: 'home-grid',
                    style: 'grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));'
                });
                
                const learned = state.alpha[state.course] || new Set();
                
                (unit.alphabet?.table || []).forEach((x, i) => {
                    const done = learned.has(i);
                    const card = el('div', {
                        class: 'home-card' + (done ? ' done' : ''),
                        style: done ? 'border-color: var(--success); background: rgba(16, 185, 129, 0.1);' : '',
                        onclick: () => { state.letter = x; state.step = 'alpha_card'; render(); }
                    });
                    card.appendChild(el('div', { style: 'font-size: 2.5rem; font-weight: 900;' }, x.char));
                    card.appendChild(el('div', { style: 'color: var(--text-muted); font-size: 0.9rem;' }, `[${x.sound}]`));
                    grid.appendChild(card);
                });
                
                app.appendChild(grid);
                
                if (learned.size === (unit.alphabet?.table?.length || 0)) {
                    app.appendChild(el('button', {
                        class: 'btn btn-primary',
                        onclick: () => { state.step = 'words'; render(); }
                    }, 'Дальше: Слова →'));
                }
            }
            else if (state.step === 'alpha_card') {
                const x = state.letter;
                const wrong = (unit.alphabet?.table || [])
                    .filter(y => y.sound !== x.sound)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3)
                    .map(y => y.sound);
                const opts = [x.sound, ...wrong].sort(() => Math.random() - 0.5);

                app.appendChild(el('div', { 
                    class: 'lesson-header',
                    style: 'font-size: 6rem; margin: 40px 0;'
                }, x.char));
                
                app.appendChild(el('p', { 
                    style: 'text-align: center; font-size: 1.3rem; margin-bottom: 20px;'
                }, `Звук: [${x.sound}]`));
                
                app.appendChild(el('p', { 
                    style: 'text-align: center; color: var(--text-muted); margin-bottom: 40px; font-size: 1.1rem;'
                }, `Пример: ${x.ex}`));

                const qBox = el('div', {});
                opts.forEach(o => {
                    const btn = el('div', { class: 'quiz-option' }, `[${o}]`);
                    btn.onclick = () => {
                        if (btn.classList.contains('disabled')) return;
                        
                        if (o === x.sound) {
                            btn.classList.add('correct');
                            document.querySelectorAll('.quiz-option').forEach(b => b.classList.add('disabled'));
                            setTimeout(() => {
                                if (!state.alpha[state.course]) state.alpha[state.course] = new Set();
                                state.alpha[state.course].add(unit.alphabet.table.indexOf(x));
                                save();
                                state.step = 'alpha_grid';
                                render();
                            }, 1000);
                        } else {
                            btn.classList.add('wrong', 'disabled');
                            setTimeout(() => {
                                btn.classList.remove('wrong', 'disabled');
                            }, 800);
                        }
                    };
                    qBox.appendChild(btn);
                });
                app.appendChild(qBox);
            }
            else if (state.step === 'words') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Слова'));
                
                const list = el('div', { class: 'word-list' });
                unit.words.forEach(w => {
                    const item = el('div', { class: 'word-item' });
                    
                    const text = el('div', {});
                    text.appendChild(el('div', { class: 'sr' }, w.sr));
                    text.appendChild(el('div', { class: 'ru' }, w.ru));
                    item.appendChild(text);
                    
                    const audioBtn = el('button', { 
                        class: 'audio-btn',
                        onclick: () => {
                            const utter = new SpeechSynthesisUtterance(w.sr);
                            utter.lang = state.data.speechLang || 'ru-RU';
                            speechSynthesis.speak(utter);
                        }
                    }, '🔊');
                    item.appendChild(audioBtn);
                    
                    list.appendChild(item);
                });
                app.appendChild(list);
                
                app.appendChild(el('button', {
                    class: 'btn btn-primary',
                    onclick: () => { state.step = 'grammar'; render(); }
                }, 'Дальше: Грамматика →'));
            }
            else if (state.step === 'grammar') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Грамматика'));
                
                const box = el('div', { class: 'grammar-box' });
                box.appendChild(el('h3', {}, unit.grammar.title));
                box.appendChild(el('p', {}, unit.grammar.rules));
                app.appendChild(box);
                
                if (unit.grammar.examples) {
                    unit.grammar.examples.forEach(ex => {
                        const item = el('div', { class: 'word-item', style: 'margin-bottom: 12px;' });
                        item.appendChild(el('div', { style: 'font-style: italic; font-size: 1.1rem;' }, ex.sr));
                        item.appendChild(el('div', { style: 'color: var(--text-muted);' }, ex.ru));
                        app.appendChild(item);
                    });
                }
                
                app.appendChild(el('button', {
                    class: 'btn btn-primary',
                    onclick: () => { state.step = 'quiz'; render(); }
                }, 'Дальше: Тест →'));
            }
            else if (state.step === 'quiz') {
                if (state.qi >= unit.quiz.length) {
                    if (!state.progress[state.course]) state.progress[state.course] = new Set();
                    state.progress[state.course].add(unit.id);
                    state.xp += 50;
                    save();

                    const success = el('div', { class: 'success-screen' });
                    success.appendChild(el('div', { class: 'icon' }, '🎉'));
                    success.appendChild(el('h2', { style: 'font-size: 2rem; margin-bottom: 16px;' }, 'Урок пройден!'));
                    success.appendChild(el('p', { style: 'color: var(--text-muted); font-size: 1.2rem; margin-bottom: 30px;' }, '+50 XP'));
                    success.appendChild(el('button', {
                        class: 'btn btn-primary',
                        onclick: () => { state.screen = 'learn'; render(); }
                    }, 'Продолжить'));
                    app.appendChild(success);
                } else {
                    const q = unit.quiz[state.qi];
                    app.appendChild(el('h2', { 
                        class: 'lesson-header' 
                    }, `Вопрос ${state.qi + 1}/${unit.quiz.length}`));
                    app.appendChild(el('p', { 
                        style: 'text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: 40px;'
                    }, q.q));

                    const qBox = el('div', {});
                    q.options.forEach((opt, i) => {
                        const btn = el('div', { class: 'quiz-option' }, opt);
                        btn.onclick = () => {
                            if (btn.classList.contains('disabled')) return;
                            
                            if (i === q.correct) {
                                btn.classList.add('correct');
                                document.querySelectorAll('.quiz-option').forEach(b => b.classList.add('disabled'));
                                setTimeout(() => { state.qi++; render(); }, 1000);
                            } else {
                                btn.classList.add('wrong', 'disabled');
                                setTimeout(() => {
                                    btn.classList.remove('wrong', 'disabled');
                                }, 800);
                            }
                        };
                        qBox.appendChild(btn);
                    });
                    app.appendChild(qBox);
                }
            }

            root.appendChild(app);
        }

        function renderLibrary(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'home'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            app.appendChild(el('h1', { 
                style: 'font-size: 2rem; margin-bottom: 30px;' 
            }, 'Библиотека'));

            if (state.loading) {
                root.appendChild(app);
                return;
            }

            const prog = state.progress[state.course] || new Set();
            const done = state.data?.units.filter(u => prog.has(u.id)) || [];

            if (!done.length) {
                app.appendChild(el('p', { 
                    style: 'text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-top: 50px;'
                }, 'Пока пусто. Пройди первый урок!'));
            } else {
                done.forEach(u => {
                    const item = el('div', {
                        class: 'word-item',
                        style: 'cursor: pointer; margin-bottom: 12px;',
                        onclick: () => {
                            state.unit = u;
                            state.step = u.alphabet ? 'alpha_grid' : 'words';
                            state.qi = 0;
                            state.screen = 'lesson';
                            render();
                        }
                    });
                    item.appendChild(el('div', { style: 'font-weight: 800; font-size: 1.1rem;' }, `${u.icon || '📖'} ${u.title}`));
                    item.appendChild(el('div', { style: 'color: var(--success); font-size: 0.9rem;' }, 'ПОВТОРИТЬ →'));
                    app.appendChild(item);
                });
            }

            root.appendChild(app);
        }

        function renderShop(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'home'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            app.appendChild(el('h1', { 
                style: 'font-size: 2rem; margin-bottom: 30px;' 
            }, 'Магазин'));

            const items = [
                { id: 'm1', name: 'Бронза', price: 100, icon: '🥉' },
                { id: 'm2', name: 'Серебро', price: 300, icon: '🥈' },
                { id: 'm3', name: 'Золото', price: 500, icon: '🥇' }
            ];

            const grid = el('div', { class: 'home-grid' });
            items.forEach(it => {
                const owned = state.medals.includes(it.id);
                const card = el('div', { 
                    class: 'home-card' + (owned ? ' owned' : ''),
                    style: owned ? 'border-color: var(--success);' : ''
                });
                card.appendChild(el('div', { style: 'font-size: 4rem; margin-bottom: 16px;' }, it.icon));
                card.appendChild(el('h3', {}, it.name));
                card.appendChild(el('p', { style: 'color: var(--warning); font-weight: 800; font-size: 1.2rem;' }, `${it.price} XP`));
                card.appendChild(el('button', {
                    class: 'btn ' + (owned ? 'btn-secondary' : 'btn-primary'),
                    style: 'margin-top: 16px;',
                    onclick: () => {
                        if (owned) return;
                        if (state.xp >= it.price) {
                            state.xp -= it.price;
                            state.medals.push(it.id);
                            save();
                            render();
                        } else {
                            alert('Недостаточно XP!');
                        }
                    }
                }, owned ? '✓ Куплено' : 'Купить'));
                grid.appendChild(card);
            });
            app.appendChild(grid);
            root.appendChild(app);
        }

        function renderRanked(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'home'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            app.appendChild(el('h1', { 
                style: 'font-size: 2rem; margin-bottom: 30px;' 
            }, 'Ранкед'));

            const leaders = [
                { n: 'BoborMaster', x: 5000 },
                { n: 'Polyglot', x: 3200 },
                { n: state.user?.email?.split('@')[0] || 'Вы', x: state.xp },
                { n: 'Newbie', x: 100 }
            ].sort((a, b) => b.x - a.x);

            leaders.forEach((l, i) => {
                const isMe = l.n === (state.user?.email?.split('@')[0] || 'Вы');
                const row = el('div', {
                    class: 'word-item' + (isMe ? ' me' : ''),
                    style: isMe ? 'border-color: var(--primary); background: rgba(99, 102, 241, 0.1);' : 'margin-bottom: 12px;'
                });
                row.appendChild(el('div', { style: 'font-weight: 900; width: 40px; font-size: 1.2rem;' }, `#${i + 1}`));
                row.appendChild(el('div', { style: 'flex: 1; font-weight: 700; font-size: 1.1rem;' }, l.n));
                row.appendChild(el('div', { style: 'color: var(--warning); font-weight: 800; font-size: 1.2rem;' }, `${l.x} XP`));
                app.appendChild(row);
            });

            root.appendChild(app);
        }

        function renderSettings(root) {
            const app = el('div', { class: 'app fade-in' });

            const backBtn = el('button', { 
                class: 'back-btn',
                onclick: () => { state.screen = 'home'; render(); }
            }, '← Назад');
            app.appendChild(backBtn);

            app.appendChild(el('h1', { 
                style: 'font-size: 2rem; margin-bottom: 30px;' 
            }, 'Настройки'));

            const themeItem = el('div', {
                class: 'word-item',
                style: 'cursor: pointer; margin-bottom: 16px;',
                onclick: () => {
                    state.theme = state.theme === 'dark' ? 'light' : 'dark';
                    save();
                    render();
                }
            });
            themeItem.appendChild(el('div', { style: 'font-weight: 700; font-size: 1.1rem;' }, 'Темная тема'));
            themeItem.appendChild(el('div', { style: 'font-size: 1.5rem;' }, state.theme === 'dark' ? '🌙' : '☀️'));
            app.appendChild(themeItem);

            const logoutBtn = el('button', {
                class: 'btn btn-secondary',
                style: 'margin-top: 30px; color: var(--error); border-color: var(--error);',
                onclick: () => {
                    state.user = null;
                    state.screen = 'auth';
                    save();
                    render();
                }
            }, 'Выйти');
            app.appendChild(logoutBtn);

            root.appendChild(app);
        }

        load();
        render();
    </script>
</body>
</html>
