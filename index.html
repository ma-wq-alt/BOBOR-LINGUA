<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOBOR-LINGUO — учи языки</title>
    <link rel="icon" href="/images/beaver.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #58cc02;
            --bg-dark: #46a302;
            --card: #ffffff;
            --card-hover: #f7f7f7;
            --text: #3c3c3c;
            --text-muted: #777777;
            --border: #e5e5e5;
            --shadow: 0 4px 0 #e5e5e5;
            --shadow-active: 0 0 0 #e5e5e5;
            --green: #58cc02;
            --green-dark: #46a302;
            --green-light: #89e219;
            --red: #ff4b4b;
            --red-dark: #ea2b2b;
            --blue: #1cb0f6;
            --blue-dark: #1899d6;
            --yellow: #ffc800;
            --yellow-dark: #e5a100;
            --purple: #ce82ff;
            --purple-dark: #a855f7;
            --gold: #fbbf24;
        }

        [data-theme="dark"] {
            --bg: #131f24;
            --bg-dark: #0d1418;
            --card: #202f36;
            --card-hover: #2a3b44;
            --text: #ffffff;
            --text-muted: #999999;
            --border: #37464f;
            --shadow: 0 4px 0 #0d1418;
            --shadow-active: 0 0 0 #0d1418;
            --green: #58cc02;
            --green-dark: #46a302;
            --green-light: #89e219;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            transition: background 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                transform: scale(1);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.08);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        .slide-in {
            animation: slideIn 0.4s ease forwards;
        }

        .scale-in {
            animation: scaleIn 0.3s ease forwards;
        }

        .shake {
            animation: shake 0.4s ease;
        }

        .pop {
            animation: pop 0.3s ease;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg);
            padding: 10px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 900;
            font-size: 1.2rem;
            cursor: pointer;
            color: var(--text);
            text-decoration: none;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--green-light);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .stats {
            display: flex;
            gap: 8px;
        }

        .stat-pill {
            background: var(--card);
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: transform 0.1s;
        }

        .stat-pill:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-active);
        }

        .stat-pill .val {
            color: var(--yellow);
        }

        .stat-pill.streak .val {
            color: var(--red);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: grid;
            place-items: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            padding: 6px;
            transition: transform 0.1s;
        }

        .icon-btn:active {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        .icon-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .lang-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .lang-scroll::-webkit-scrollbar {
            display: none;
        }

        .lang-btn {
            background: var(--card);
            border: 2px solid var(--border);
            padding: 10px 16px;
            border-radius: 16px;
            font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .lang-btn:active {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        .lang-btn.active {
            border-color: var(--green);
            background: var(--green);
            color: #fff;
        }

        .home-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .home-card {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform 0.1s;
        }

        .home-card:active {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        .home-card img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
            object-fit: contain;
        }

        .home-card h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .home-card p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .path-container {
            position: relative;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .path-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 8px;
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-50%);
            border-radius: 4px;
            z-index: 0;
        }

        .path-node {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--green);
            border: 4px solid var(--green-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            z-index: 1;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--green-dark);
            position: relative;
            transition: transform 0.1s;
        }

        .path-node:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        .path-node.locked {
            background: var(--border);
            border-color: var(--text-muted);
            box-shadow: 0 6px 0 var(--text-muted);
            filter: grayscale(1);
            opacity: 0.7;
            cursor: not-allowed;
        }

        .path-node.done {
            background: var(--yellow);
            border-color: var(--yellow-dark);
            box-shadow: 0 6px 0 var(--yellow-dark);
        }

        .path-label {
            position: absolute;
            top: 80px;
            width: 150px;
            text-align: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text);
        }

        .lesson-header {
            text-align: center;
            margin: 20px 0;
            font-size: 1.5rem;
            font-weight: 900;
        }

        .word-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .word-item {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            transition: transform 0.1s;
        }

        .word-item:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-active);
        }

        .grammar-box {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .quiz-option {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s;
        }

        .quiz-option:active:not(.disabled) {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        .quiz-option.correct {
            background: #d7ffb8;
            border-color: var(--green);
            color: var(--green-dark);
            animation: pop 0.3s;
        }

        .quiz-option.wrong {
            background: #ffdfe0;
            border-color: var(--red);
            color: var(--red);
            animation: shake 0.4s;
        }

        .quiz-option.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 16px;
            border: none;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--shadow);
            margin-top: 20px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: var(--shadow-active);
        }

        .btn-primary {
            background: var(--green);
            color: #fff;
            border-bottom: 4px solid var(--green-dark);
        }

        .btn-primary:active {
            border-bottom: 0;
            margin-top: 24px;
        }

        .btn-ghost {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-muted);
            box-shadow: none;
        }

        .btn-blue {
            background: var(--blue);
            color: #fff;
            border-bottom: 4px solid var(--blue-dark);
        }

        .btn-green {
            background: var(--green);
            color: #fff;
            border-bottom: 4px solid var(--green-dark);
        }

        .auth-box {
            background: var(--card);
            padding: 30px;
            border-radius: 20px;
            margin-top: 50px;
            box-shadow: var(--shadow);
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--green);
        }

        .audio-btn {
            background: var(--bg);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 1.2rem;
            transition: transform 0.1s;
        }

        .audio-btn:active {
            transform: scale(0.95);
        }

        .lib-item {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .lib-item:active {
            transform: translateY(2px);
            box-shadow: var(--shadow-active);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .shop-item {
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .shop-item.owned {
            border-color: var(--green);
            background: var(--green-light);
        }

        .rank-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            box-shadow: var(--shadow);
        }

        .rank-row.me {
            border-color: var(--green);
            background: var(--green-light);
        }

        .success-screen {
            text-align: center;
            padding: 40px 20px;
        }

        @media (max-width: 480px) {
            .home-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Конфигурация курсов
        const COURSES = {
            sr: { flag: "🇷🇸", name: "Сербский" },
            tr: { flag: "🇹🇷", name: "Турецкий" },
            pl: { flag: "🇵🇱", name: "Польский" },
            be: { flag: "🇧🇾", name: "Белорусский" },
            kk: { flag: "🇰🇿", name: "Казахский" },
            tt: { flag: "🏳️", name: "Татарский" }
        };

        // Состояние приложения
        let S = {
            screen: 'auth',
            user: null,
            theme: 'light',
            course: 'sr',
            xp: 0,
            streak: 0,
            progress: {},
            alpha: {},
            medals: [],
            unit: null,
            step: 'words',
            letter: null,
            qi: 0,
            loading: false,
            data: null
        };

        // Утилита для создания элементов
        const el = (tag, attrs = {}, children = []) => {
            const e = document.createElement(tag);
            for (let k in attrs) {
                if (k === 'class') {
                    e.className = attrs[k];
                } else if (k.startsWith('on')) {
                    e.addEventListener(k.slice(2), attrs[k]);
                } else {
                    e.setAttribute(k, attrs[k]);
                }
            }
            (Array.isArray(children) ? children : [children]).forEach(c => {
                if (c != null && c !== false) {
                    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
                }
            });
            return e;
        };

        // Сохранение состояния
        function save() {
            localStorage.setItem('bobor_v2', JSON.stringify({
                user: S.user,
                theme: S.theme,
                xp: S.xp,
                streak: S.streak,
                course: S.course,
                progress: Object.fromEntries(Object.entries(S.progress).map(([k, v]) => [k, [...v]])),
                alpha: Object.fromEntries(Object.entries(S.alpha).map(([k, v]) => [k, [...v]])),
                medals: S.medals
            }));
            if (S.user) {
                fetch('/api/sync-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: S.user.email,
                        xp: S.xp,
                        streak: S.streak,
                        medals: S.medals,
                        units_done: Object.fromEntries(Object.entries(S.progress).map(([k, v]) => [k, [...v]]))
                    })
                }).catch(() => {});
            }
        }

        // Загрузка состояния
        function load() {
            try {
                const d = JSON.parse(localStorage.getItem('bobor_v2'));
                if (d) {
                    S.user = d.user;
                    S.theme = d.theme || 'light';
                    S.xp = d.xp || 0;
                    S.streak = d.streak || 0;
                    S.course = d.course || 'sr';
                    S.medals = d.medals || [];
                    S.progress = Object.fromEntries(Object.entries(d.progress || {}).map(([k, v]) => [k, new Set(v)]));
                    S.alpha = Object.fromEntries(Object.entries(d.alpha || {}).map(([k, v]) => [k, new Set(v)]));
                    if (S.user) S.screen = 'home';
                }
            } catch (e) {
                console.error('Load error:', e);
            }
        }

        // Загрузка курса
        async function loadCourse() {
            S.loading = true;
            render();
            try {
                const r = await fetch(`/data/${S.course}.json`);
                S.data = await r.json();
            } catch (e) {
                S.data = { name: "Ошибка", units: [] };
            }
            S.loading = false;
            render();
        }

        // Главный рендер
        function render() {
            const root = document.getElementById('root');
            root.innerHTML = '';
            document.documentElement.setAttribute('data-theme', S.theme);

            if (!S.user && S.screen !== 'auth') S.screen = 'auth';

            if (S.screen === 'auth') renderAuth(root);
            else if (S.screen === 'home') renderHome(root);
            else if (S.screen === 'learn') renderLearn(root);
            else if (S.screen === 'lesson') renderLesson(root);
            else if (S.screen === 'library') renderLibrary(root);
            else if (S.screen === 'shop') renderShop(root);
            else if (S.screen === 'ranked') renderRanked(root);
            else if (S.screen === 'settings') renderSettings(root);
        }

        // Экран авторизации
        function renderAuth(root) {
            const box = el('div', { class: 'auth-box' }, [
                el('h1', { style: 'text-align:center;margin-bottom:20px' }, 'BOBOR-LINGUO'),
                el('input', { type: 'email', placeholder: 'Email', id: 'email' }),
                el('input', { type: 'password', placeholder: 'Пароль', id: 'pass' }),
                el('button', {
                    class: 'btn btn-primary',
                    onclick: async () => {
                        const em = document.getElementById('email').value;
                        const pw = document.getElementById('pass').value;
                        if (!em || !pw) return;
                        const r = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email: em, password: pw })
                        });
                        const d = await r.json();
                        if (d.success) {
                            S.user = d.user;
                            S.screen = 'home';
                            save();
                            render();
                        } else {
                            alert(d.error || 'Ошибка входа');
                        }
                    }
                }, 'Войти'),
                el('p', {
                    style: 'text-align:center;margin-top:15px;font-size:0.9rem;color:var(--text-muted);cursor:pointer',
                    onclick: () => alert('Регистрация пока закрыта')
                }, 'Нет аккаунта?')
            ]);
            root.appendChild(box);
        }

        // Главный экран
        function renderHome(root) {
            const app = el('div', { class: 'app' });

            // Верхняя панель
            app.appendChild(el('div', { class: 'topbar' }, [
                el('a', { class: 'brand', onclick: () => { S.screen = 'home'; render(); } }, [
                    el('div', { class: 'brand-logo' }, el('img', { src: '/images/beaver.png' })),
                    el('span', {}, 'BOBOR')
                ]),
                el('div', { class: 'stats' }, [
                    el('div', { class: 'stat-pill streak' }, ['🔥 ', S.streak]),
                    el('div', { class: 'stat-pill' }, ['⚡ ', S.xp]),
                    el('div', {
                        class: 'icon-btn',
                        onclick: () => { S.screen = 'settings'; render(); }
                    }, el('img', { src: '/images/settings.png' }))
                ])
            ]));

            // Выбор языка
            const scroll = el('div', { class: 'lang-scroll' });
            Object.keys(COURSES).forEach(c => {
                scroll.appendChild(el('div', {
                    class: 'lang-btn ' + (S.course === c ? 'active' : ''),
                    onclick: () => { S.course = c; save(); render(); }
                }, [COURSES[c].flag, ' ', COURSES[c].name]));
            });
            app.appendChild(scroll);

            // Приветствие
            app.appendChild(el('h1', {
                style: 'margin-bottom:20px;font-size:1.8rem'
            }, `Привет, ${S.user?.email?.split('@')[0] || 'друг'}! 👋`));

            // Сетка карточек
            const grid = el('div', { class: 'home-grid' });
            const cards = [
                { id: 'learn', icon: '/images/learn.png', title: 'Обучение', desc: 'Путь' },
                { id: 'library', icon: '📚', title: 'Библиотека', desc: 'Пройденное' },
                { id: 'shop', icon: '/images/shop.png', title: 'Магазин', desc: 'Медали' },
                { id: 'ranked', icon: '/images/ranked.png', title: 'Ранкед', desc: 'Лидеры' }
            ];
            cards.forEach(c => {
                const isImg = c.icon.startsWith('/');
                grid.appendChild(el('div', {
                    class: 'home-card',
                    onclick: () => {
                        S.screen = c.id;
                        if (c.id === 'learn' || c.id === 'library') loadCourse();
                        else render();
                    }
                }, [
                    isImg ? el('img', { src: c.icon }) : el('div', { style: 'font-size:3rem;margin-bottom:10px' }, c.icon),
                    el('h3', {}, c.title),
                    el('p', {}, c.desc)
                ]));
            });
            app.appendChild(grid);
            root.appendChild(app);
        }

        // Экран обучения
        function renderLearn(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'home'; render(); }
                }, '←'),
                el('h2', { style: 'flex:1;text-align:center' }, S.data?.name || 'Курс')
            ]));

            if (S.loading) {
                app.appendChild(el('p', { style: 'text-align:center;margin-top:50px' }, 'Загрузка...'));
                root.appendChild(app);
                return;
            }
            if (!S.data) {
                app.appendChild(el('p', { style: 'text-align:center;margin-top:50px' }, 'Ошибка загрузки'));
                root.appendChild(app);
                return;
            }

            const path = el('div', { class: 'path-container' });
            path.appendChild(el('div', { class: 'path-line' }));

            const prog = S.progress[S.course] || new Set();
            let prevDone = true;

            S.data.units.forEach((u, i) => {
                const done = prog.has(u.id);
                const locked = !prevDone;
                const node = el('div', {
                    class: `path-node ${locked ? 'locked' : ''} ${done ? 'done' : ''}`,
                    onclick: () => {
                        if (locked) return;
                        S.unit = u;
                        S.step = u.alphabet ? 'alpha_grid' : 'words';
                        S.qi = 0;
                        S.screen = 'lesson';
                        render();
                    }
                }, [el('span', {}, done ? '✓' : (locked ? '🔒' : '▶'))]);

                node.appendChild(el('div', { class: 'path-label' }, u.title));
                path.appendChild(node);
                prevDone = done;
            });

            app.appendChild(path);
            root.appendChild(app);
        }

        // Экран урока
        function renderLesson(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'learn'; render(); }
                }, '✕')
            ]));

            const u = S.unit;
            if (!u) return;

            // Сетка алфавита
            if (S.step === 'alpha_grid') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Алфавит'));
                const grid = el('div', {
                    class: 'home-grid',
                    style: 'grid-template-columns:repeat(auto-fill, minmax(70px, 1fr))'
                });
                const learned = S.alpha[S.course] || new Set();

                (u.alphabet?.table || []).forEach((x, i) => {
                    const done = learned.has(i);
                    grid.appendChild(el('div', {
                        class: 'home-card ' + (done ? 'done' : ''),
                        style: done ? 'border-color:var(--green);background:#d7ffb8;' : '',
                        onclick: () => { S.letter = x; S.step = 'alpha_card'; render(); }
                    }, [
                        el('div', { style: 'font-size:2rem;font-weight:900' }, x.char),
                        el('div', { style: 'font-size:0.8rem;color:var(--text-muted)' }, `[${x.sound}]`)
                    ]));
                });
                app.appendChild(grid);
                if (learned.size === (u.alphabet?.table?.length || 0)) {
                    app.appendChild(el('button', {
                        class: 'btn btn-green',
                        onclick: () => { S.step = 'words'; render(); }
                    }, 'Дальше: Слова'));
                }
            }

            // Карточка буквы с квизом
            else if (S.step === 'alpha_card') {
                const x = S.letter;
                const wrong = (u.alphabet?.table || [])
                    .filter(y => y.sound !== x.sound)
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3)
                    .map(y => y.sound);
                const opts = [x.sound, ...wrong].sort(() => Math.random() - 0.5);

                app.appendChild(el('div', { class: 'lesson-header' }, x.char));
                app.appendChild(el('p', {
                    style: 'text-align:center;margin-bottom:20px;font-size:1.2rem'
                }, `Звук: [${x.sound}]`));
                app.appendChild(el('p', {
                    style: 'text-align:center;margin-bottom:30px;color:var(--text-muted)'
                }, `Пример: ${x.ex}`));

                const qBox = el('div', {});
                opts.forEach(o => {
                    const btn = el('div', { class: 'quiz-option' }, `[${o}]`);
                    btn.onclick = () => {
                        if (btn.classList.contains('disabled')) return;
                        if (o === x.sound) {
                            btn.classList.add('correct');
                            document.querySelectorAll('.quiz-option').forEach(b => b.classList.add('disabled'));
                            setTimeout(() => {
                                if (!S.alpha[S.course]) S.alpha[S.course] = new Set();
                                S.alpha[S.course].add(u.alphabet.table.indexOf(x));
                                save();
                                S.step = 'alpha_grid';
                                render();
                            }, 1000);
                        } else {
                            btn.classList.add('wrong', 'disabled');
                            setTimeout(() => {
                                btn.classList.remove('wrong', 'disabled');
                            }, 800);
                        }
                    };
                    qBox.appendChild(btn);
                });
                app.appendChild(qBox);
            }

            // Слова
            else if (S.step === 'words') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Слова'));
                const list = el('div', { class: 'word-list' });
                u.words.forEach(w => {
                    list.appendChild(el('div', { class: 'word-item' }, [
                        el('div', {}, [
                            el('div', { style: 'font-weight:800;font-size:1.1rem' }, w.sr),
                            el('div', { style: 'color:var(--text-muted);font-size:0.9rem' }, w.ru)
                        ]),
                        el('button', {
                            class: 'audio-btn',
                            onclick: () => {
                                const utter = new SpeechSynthesisUtterance(w.sr);
                                utter.lang = S.data.speechLang || 'ru-RU';
                                speechSynthesis.speak(utter);
                            }
                        }, '🔊')
                    ]));
                });
                app.appendChild(list);
                app.appendChild(el('button', {
                    class: 'btn btn-primary',
                    onclick: () => { S.step = 'grammar'; render(); }
                }, 'Дальше: Грамматика'));
            }

            // Грамматика
            else if (S.step === 'grammar') {
                app.appendChild(el('h2', { class: 'lesson-header' }, 'Грамматика'));
                app.appendChild(el('div', { class: 'grammar-box' }, [
                    el('h3', { style: 'color:var(--blue);margin-bottom:10px' }, u.grammar.title),
                    el('p', { style: 'white-space:pre-wrap;line-height:1.6' }, u.grammar.rules)
                ]));
                if (u.grammar.examples) {
                    u.grammar.examples.forEach(ex => {
                        app.appendChild(el('div', {
                            class: 'word-item',
                            style: 'margin-bottom:10px'
                        }, [
                            el('div', { style: 'font-style:italic' }, ex.sr),
                            el('div', { style: 'color:var(--text-muted)' }, ex.ru)
                        ]));
                    });
                }
                app.appendChild(el('button', {
                    class: 'btn btn-blue',
                    onclick: () => { S.step = 'quiz'; render(); }
                }, 'Дальше: Тест'));
            }

            // Квиз
            else if (S.step === 'quiz') {
                if (S.qi >= u.quiz.length) {
                    if (!S.progress[S.course]) S.progress[S.course] = new Set();
                    S.progress[S.course].add(u.id);
                    S.xp += 50;
                    save();

                    app.appendChild(el('div', { class: 'success-screen' }, [
                        el('div', { style: 'font-size:5rem;margin-bottom:20px' }, '🎉'),
                        el('h2', { style: 'margin-bottom:10px' }, 'Урок пройден!'),
                        el('p', { style: 'color:var(--text-muted);margin-bottom:30px' }, '+50 XP'),
                        el('button', {
                            class: 'btn btn-primary',
                            onclick: () => { S.screen = 'learn'; render(); }
                        }, 'Продолжить')
                    ]));
                } else {
                    const q = u.quiz[S.qi];
                    app.appendChild(el('h2', {
                        class: 'lesson-header'
                    }, `Вопрос ${S.qi + 1}/${u.quiz.length}`));
                    app.appendChild(el('p', {
                        style: 'text-align:center;font-size:1.2rem;font-weight:700;margin-bottom:30px'
                    }, q.q));

                    const qBox = el('div', {});
                    q.options.forEach((opt, i) => {
                        const btn = el('div', { class: 'quiz-option' }, opt);
                        btn.onclick = () => {
                            if (btn.classList.contains('disabled')) return;
                            if (i === q.correct) {
                                btn.classList.add('correct');
                                document.querySelectorAll('.quiz-option').forEach(b => b.classList.add('disabled'));
                                setTimeout(() => { S.qi++; render(); }, 1000);
                            } else {
                                btn.classList.add('wrong', 'disabled');
                                setTimeout(() => {
                                    btn.classList.remove('wrong', 'disabled');
                                }, 800);
                            }
                        };
                        qBox.appendChild(btn);
                    });
                    app.appendChild(qBox);
                }
            }

            root.appendChild(app);
        }

        // Библиотека
        function renderLibrary(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'home'; render(); }
                }, '←')
            ]));
            app.appendChild(el('h1', { style: 'margin-bottom:20px' }, 'Библиотека'));

            if (S.loading) {
                root.appendChild(app);
                return;
            }
            const prog = S.progress[S.course] || new Set();
            const done = S.data?.units.filter(u => prog.has(u.id)) || [];

            if (!done.length) {
                app.appendChild(el('p', {
                    style: 'text-align:center;color:var(--text-muted);margin-top:50px'
                }, 'Пока пусто. Пройди первый урок!'));
            } else {
                done.forEach(u => {
                    app.appendChild(el('div', {
                        class: 'lib-item',
                        onclick: () => {
                            S.unit = u;
                            S.step = u.alphabet ? 'alpha_grid' : 'words';
                            S.qi = 0;
                            S.screen = 'lesson';
                            render();
                        }
                    }, [
                        el('div', { style: 'font-weight:800' }, `${u.icon || '📖'} ${u.title}`),
                        el('div', { style: 'color:var(--green);font-size:0.8rem' }, 'ПОВТОРИТЬ')
                    ]));
                });
            }
            root.appendChild(app);
        }

        // Магазин
        function renderShop(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'home'; render(); }
                }, '←')
            ]));
            app.appendChild(el('h1', { style: 'margin-bottom:20px' }, 'Магазин'));

            const items = [
                { id: 'm1', name: 'Бронза', price: 100, icon: '🥉' },
                { id: 'm2', name: 'Серебро', price: 300, icon: '🥈' },
                { id: 'm3', name: 'Золото', price: 500, icon: '🥇' }
            ];

            const grid = el('div', { class: 'shop-grid' });
            items.forEach(it => {
                const owned = S.medals.includes(it.id);
                grid.appendChild(el('div', {
                    class: 'shop-item' + (owned ? ' owned' : '')
                }, [
                    el('div', { style: 'font-size:3rem;margin-bottom:10px' }, it.icon),
                    el('h3', {}, it.name),
                    el('p', { style: 'color:var(--yellow);font-weight:800' }, `${it.price} XP`),
                    el('button', {
                        class: 'btn ' + (owned ? 'btn-ghost' : 'btn-primary'),
                        style: 'margin-top:10px;padding:10px;font-size:0.8rem',
                        onclick: () => {
                            if (owned) return;
                            if (S.xp >= it.price) {
                                S.xp -= it.price;
                                S.medals.push(it.id);
                                save();
                                render();
                            } else {
                                alert('Недостаточно XP!');
                            }
                        }
                    }, owned ? 'Куплено' : 'Купить')
                ]));
            });
            app.appendChild(grid);
            root.appendChild(app);
        }

        // Ранкед
        function renderRanked(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'home'; render(); }
                }, '←')
            ]));
            app.appendChild(el('h1', { style: 'margin-bottom:20px' }, 'Ранкед'));

            const leaders = [
                { n: 'BoborMaster', x: 5000 },
                { n: 'Polyglot', x: 3200 },
                { n: S.user?.email?.split('@')[0] || 'Вы', x: S.xp },
                { n: 'Newbie', x: 100 }
            ].sort((a, b) => b.x - a.x);

            leaders.forEach((l, i) => {
                const isMe = l.n === (S.user?.email?.split('@')[0] || 'Вы');
                app.appendChild(el('div', {
                    class: 'rank-row' + (isMe ? ' me' : '')
                }, [
                    el('div', { style: 'font-weight:900;width:30px' }, `#${i + 1}`),
                    el('div', { style: 'flex:1;font-weight:700' }, l.n),
                    el('div', { style: 'color:var(--yellow);font-weight:800' }, `${l.x} XP`)
                ]));
            });
            root.appendChild(app);
        }

        // Настройки
        function renderSettings(root) {
            const app = el('div', { class: 'app' });
            app.appendChild(el('div', { class: 'topbar' }, [
                el('div', {
                    class: 'icon-btn',
                    onclick: () => { S.screen = 'home'; render(); }
                }, '←')
            ]));
            app.appendChild(el('h1', { style: 'margin-bottom:20px' }, 'Настройки'));

            app.appendChild(el('div', {
                class: 'word-item',
                style: 'margin-bottom:15px;cursor:pointer',
                onclick: () => {
                    S.theme = S.theme === 'light' ? 'dark' : 'light';
                    save();
                    render();
                }
            }, [
                el('div', { style: 'font-weight:700' }, 'Темная тема'),
                el('div', { style: 'font-size:1.5rem' }, S.theme === 'dark' ? '🌙' : '☀️')
            ]));

            app.appendChild(el('button', {
                class: 'btn btn-ghost',
                style: 'margin-top:30px;color:var(--red);border-color:var(--red)',
                onclick: () => {
                    S.user = null;
                    S.screen = 'auth';
                    save();
                    render();
                }
            }, 'Выйти'));

            root.appendChild(app);
        }

        // Инициализация
        load();
        render();
    </script>
</body>
</html>
