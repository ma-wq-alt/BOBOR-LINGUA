<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOBOR-LINGUO — учи языки</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦫</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root, [data-theme="dark"] {
    --bg: #0d1117; --bg2: #161b25; --card: #1c2333; --card2: #252d40;
    --border: #2d3549; --text: #eef2fa; --muted: #7d8ba5;
    --serbian: #c6363c; --serbian2: #e04a50;
    --blue: #3b82f6; --green: #10b981; --green2: #059669;
    --yellow: #f59e0b; --purple: #8b5cf6; --red: #ef4444; --gold: #fbbf24;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f5f7fb; --bg2: #e8ecf3; --card: #ffffff; --card2: #eef1f7;
    --border: #d8dfea; --text: #1a2233; --muted: #6b7891;
    --serbian: #c6363c; --serbian2: #e04a50;
    --blue: #2563eb; --green: #059669; --green2: #047857;
    --yellow: #d97706; --purple: #7c3aed; --red: #dc2626; --gold: #d97706;
    --shadow: 0 8px 32px rgba(0,0,0,0.1);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; overflow-x: hidden; font-weight: 500; transition: background 0.3s, color 0.3s; }
  .app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 18px 120px; min-height: 100vh; }

  /* HEADER */
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 10px; position: sticky; top: 0; padding: 8px 0; background: linear-gradient(180deg, var(--bg) 60%, transparent); z-index: 10; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.05rem; cursor: pointer; }
  .brand-logo { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, var(--serbian), var(--serbian2)); display: grid; place-items: center; font-size: 1.4rem; box-shadow: 0 4px 16px rgba(198,54,60,0.35); }
  .stats-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
  .stats-pill { display: flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--border); padding: 7px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 800; }
  .stats-pill .val { color: var(--yellow); }
  .stats-pill.streak .val { color: var(--serbian2); }
  .icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 1rem; transition: all 0.2s; font-family: inherit; }

  /* ЯЗЫКИ */
  .lang-selector { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
  .lang-btn { background: var(--card); border: 2px solid var(--border); border-radius: 16px; padding: 10px 16px; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .lang-btn:hover { border-color: var(--serbian); }
  .lang-btn.active { border-color: var(--serbian); background: rgba(198,54,60,0.1); }

  /* ГЛАВНАЯ */
  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .home-card { background: var(--card); border: 2px solid var(--border); border-radius: 24px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.25s; }
  .home-card:hover { transform: translateY(-4px); border-color: var(--serbian); box-shadow: var(--shadow); }
  .home-card .icon { font-size: 3rem; margin-bottom: 12px; display: block; }
  .home-card h2 { font-size: 1.1rem; font-weight: 800; }
  .home-card p { font-size: 0.8rem; color: var(--muted); }

  /* ОБУЧЕНИЕ (ДУОЛИНГО) */
  .path-container { display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 20px 0; position: relative; }
  .path-line { position: absolute; top: 0; bottom: 0; width: 8px; background: var(--card2); border-radius: 4px; z-index: 0; left: 50%; transform: translateX(-50%); }
  .path-node { width: 70px; height: 70px; border-radius: 50%; background: var(--card); border: 4px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 2rem; cursor: pointer; position: relative; z-index: 1; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  .path-node:hover:not(.locked) { transform: scale(1.1); border-color: var(--serbian); }
  .path-node.locked { background: var(--card2); border-color: var(--border); cursor: not-allowed; filter: grayscale(1); opacity: 0.6; }
  .path-node.done { border-color: var(--green); background: rgba(16,185,129,0.1); color: var(--green); }
  .path-node.offset-left { margin-right: 100px; }
  .path-node.offset-right { margin-left: 100px; }

  /* УРОК */
  .lesson-header { text-align: center; margin-bottom: 24px; }
  .lesson-header h2 { font-size: 1.6rem; font-weight: 900; margin-bottom: 4px; }
  .lesson-header p { color: var(--muted); font-size: 0.9rem; }
  
  .alpha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .alpha-btn { aspect-ratio: 1; background: var(--card); border: 2px solid var(--border); border-radius: 16px; font-size: 1.8rem; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s; position: relative; color: var(--text); }
  .alpha-btn:hover { transform: translateY(-3px); border-color: var(--serbian); background: var(--card2); }
  .alpha-btn .pair { font-size: 0.7rem; color: var(--muted); margin-top: 2px; font-weight: 600; }
  .alpha-btn .check { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; background: var(--green); border-radius: 50%; display: grid; place-items: center; font-size: 0.7rem; color: #fff; border: 2px solid var(--bg); }
  .alpha-btn.done { background: rgba(16,185,129,0.15); border-color: var(--green); color: var(--green); }

  .letter-display { text-align: center; background: var(--card); border-radius: 24px; padding: 30px; margin-bottom: 24px; border: 1px solid var(--border); }
  .letter-display .big-char { font-size: 5rem; font-weight: 900; color: var(--serbian2); line-height: 1; margin-bottom: 10px; }
  .letter-display .sound { font-size: 1.2rem; color: var(--blue); font-weight: 700; margin-bottom: 20px; }
  .letter-display .example { background: var(--bg2); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
  .letter-display .example .word { font-size: 1.3rem; font-weight: 800; }
  .letter-display .example .trans { color: var(--muted); font-size: 0.9rem; }
  
  .custom-audio-btn { background: var(--card2); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
  .custom-audio-btn:hover { background: var(--border); }

  .word-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 24px; }
  .word-row { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: all 0.2s; }
  .word-row:hover { border-color: var(--serbian); }
  .word-row .w-sr { font-size: 1.1rem; font-weight: 800; }
  .word-row .w-ru { color: var(--muted); font-size: 0.9rem; }
  
  .grammar-box { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-bottom: 24px; }
  .grammar-box h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 12px; color: var(--blue); }
  .grammar-box .rule { font-size: 0.95rem; line-height: 1.6; margin-bottom: 16px; }
  .grammar-box .ex { background: var(--bg2); padding: 12px 16px; border-radius: 10px; margin-bottom: 8px; font-size: 0.9rem; }
  .grammar-box .ex b { color: var(--green); }

  /* ТЕСТЫ */
  .quiz-option { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; font-weight: 600; }
  .quiz-option:hover:not(.disabled) { border-color: var(--blue); }
  .quiz-option.correct { background: rgba(16,185,129,0.15); border-color: var(--green); color: var(--green); }
  .quiz-option.wrong { background: rgba(239,68,68,0.15); border-color: var(--red); color: var(--red); }
  .quiz-option.disabled { cursor: default; }

  /* БИБЛИОТЕКА */
  .lib-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .lib-item h4 { font-size: 1rem; margin-bottom: 8px; color: var(--gold); }
  .lib-item p { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }

  /* МАГАЗИН */
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .shop-item { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
  .shop-item .s-icon { font-size: 2rem; margin-bottom: 8px; }
  .shop-item .s-name { font-weight: 800; font-size: 0.9rem; margin-bottom: 4px; }
  .shop-item .s-price { color: var(--yellow); font-weight: 800; font-size: 0.85rem; margin-bottom: 12px; }
  .shop-item.owned { border-color: var(--green); }

  /* РАНКЕД */
  .rank-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px; margin-bottom: 8px; }
  .rank-row.me { border-color: var(--serbian); background: rgba(198,54,60,0.08); }
  .rank-pos { font-weight: 900; font-size: 1rem; width: 24px; color: var(--muted); }
  .rank-name { flex: 1; font-weight: 800; font-size: 0.9rem; }
  .rank-xp { font-weight: 800; color: var(--purple); font-size: 0.85rem; }

  /* КНОПКИ */
  .btn { border: none; border-radius: 14px; padding: 16px 24px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: all 0.2s; font-family: inherit; width: 100%; display: block; text-align: center; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--serbian), var(--serbian2)); color: #fff; box-shadow: 0 4px 20px rgba(198,54,60,0.4); }
  .btn-blue { background: linear-gradient(135deg, var(--blue), #2563eb); color: #fff; }
  .btn-green { background: linear-gradient(135deg, var(--green), var(--green2)); color: #fff; }
  .btn-ghost { background: var(--card2); color: var(--text); }
  .back-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back-btn { width: 44px; height: 44px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); color: var(--text); cursor: pointer; display: grid; place-items: center; font-size: 1.1rem; }
  
  .success-screen { text-align: center; padding: 40px 20px; }
  .success-screen .emoji { font-size: 4rem; margin-bottom: 16px; }
  .success-screen h2 { font-size: 1.5rem; font-weight: 900; margin-bottom: 8px; }
  .success-screen p { color: var(--muted); margin-bottom: 24px; }
  
  @media (max-width: 480px) {
    .home-grid { grid-template-columns: 1fr; }
    .path-node.offset-left { margin-right: 60px; }
    .path-node.offset-right { margin-left: 60px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const COURSES_META = {
  sr: { flag: "🇷🇸", name: "Сербский" },
  tr: { flag: "🇹🇷", name: "Турецкий" },
  pl: { flag: "🇵🇱", name: "Польский" },
  be: { flag: "🇧🇾", name: "Белорусский" },
  kk: { flag: "🇰🇿", name: "Казахский" },
  tt: { flag: "🏳️", name: "Татарский" }
};

const state = {
  screen: "auth", user: null, settings: { theme: "dark" },
  xp: 0, streak: 0, currentCourse: "sr",
  progress: {}, alphaProgress: {}, medals: [],
  currentUnit: null, lessonStep: "words", currentAlphaLetter: null, quizIdx: 0,
  lastDaily: null, courseData: null, loading: false,
  lessonsToday: 0, lastLessonDate: null
};

let mediaRecorder;
let audioChunks = [];

function saveState() {
  const progObj = {};
  for (const k in state.progress) progObj[k] = [...state.progress[k]];
  const alphaObj = {};
  for (const k in state.alphaProgress) alphaObj[k] = [...state.alphaProgress[k]];
  
  localStorage.setItem("bobor_state_v6", JSON.stringify({
    user: state.user, settings: state.settings,
    xp: state.xp, streak: state.streak, currentCourse: state.currentCourse,
    progress: progObj, alphaProgress: alphaObj, medals: state.medals, 
    lastDaily: state.lastDaily, lessonsToday: state.lessonsToday, lastLessonDate: state.lastLessonDate
  }));
  
  if (state.user) {
    fetch("/api/sync-progress", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: state.user.username, xp: state.xp, streak: state.streak,
        medals: state.medals, last_daily: state.lastDaily,
        units_done: progObj
      })
    }).catch(e => {});
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem("bobor_state_v6");
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.user) state.user = data.user;
    if (data.settings) state.settings = { ...state.settings, ...data.settings };
    state.xp = data.xp || 0; state.streak = data.streak || 0;
    state.currentCourse = data.currentCourse || "sr";
    state.medals = data.medals || []; state.lastDaily = data.lastDaily || null;
    state.lessonsToday = data.lessonsToday || 0; state.lastLessonDate = data.lastLessonDate || null;
    
    if (data.progress) for (const k in data.progress) state.progress[k] = new Set(data.progress[k]);
    if (data.alphaProgress) for (const k in data.alphaProgress) state.alphaProgress[k] = new Set(data.alphaProgress[k]);
    
    if (state.user) state.screen = "home";
  } catch (e) {}
}

function getUfaDate() {
  const now = new Date();
  const ufaTime = new Date(now.getTime() + (5 * 60 * 60 * 1000));
  if (ufaTime.getUTCHours() < 7) ufaTime.setUTCDate(ufaTime.getUTCDate() - 1);
  return ufaTime.toISOString().split('T')[0];
}

function checkDailyStreak() {
  const today = getUfaDate();
  if (state.lastLessonDate !== today) {
    state.lessonsToday = 0;
    state.lastLessonDate = today;
  }
  if (!state.lastDaily) {
    state.streak = 1; state.lastDaily = today; saveState(); return;
  }
  if (state.lastDaily === today) return;
  const last = new Date(state.lastDaily);
  const now = new Date(today);
  const diffDays = Math.round((now - last) / 86400000);
  if (diffDays === 1) state.streak += 1;
  else if (diffDays > 1) state.streak = 1;
  state.lastDaily = today; saveState();
}

const el = (tag, attrs = {}, children = []) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  (Array.isArray(children) ? children : [children]).forEach(c => {
    if (c === null || c === undefined || c === false) return;
    if (typeof c === "string" || typeof c === "number") e.appendChild(document.createTextNode(String(c)));
    else e.appendChild(c);
  });
  return e;
};

function renderAudioButton(text) {
  const key = state.currentCourse + "_" + text;
  return el("button", { class: "custom-audio-btn", onclick: async () => {
    try {
      const res = await fetch(`/api/get-audio/${encodeURIComponent(key)}`);
      const data = await res.json();
      if (data.audio) {
        const audio = new Audio(data.audio);
        audio.play();
        return;
      }
    } catch (e) {}

    if (confirm("Записи нет. Записать голос?")) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = (event) => { audioChunks.push(event.data); };
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          const reader = new FileReader();
          reader.readAsDataURL(audioBlob); 
          reader.onloadend = async () => {
            const base64Audio = reader.result;
            try {
              await fetch("/api/save-audio", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ key, audioBase64: base64Audio })
              });
              alert("Сохранено! Теперь доступно на всех устройствах.");
            } catch (e) {
              alert("Ошибка сохранения. Проверь интернет.");
            }
          };
        };
        mediaRecorder.start();
        alert("Говори! Запись остановится через 3 секунды.");
        setTimeout(() => {
          mediaRecorder.stop();
          stream.getTracks().forEach(track => track.stop());
        }, 3000);
      } catch (e) { alert("Нет доступа к микрофону."); }
    }
  } }, [el("span", {}, "🔊 Озвучить")]);
}

async function loadCourseData() {
  state.loading = true; render();
  try {
    const res = await fetch(`/data/${state.currentCourse}.json`);
    if (!res.ok) throw new Error("Файл не найден");
    state.courseData = await res.json();
  } catch (e) {
    state.courseData = { code: state.currentCourse, name: "Курс", flag: "🏳️", units: [] };
  }
  state.loading = false; render();
}

function changeLanguage(langCode) {
  state.currentCourse = langCode;
  state.courseData = null;
  saveState();
  if (state.screen === "learn" || state.screen === "library") loadCourseData();
  else render();
}

const root = document.getElementById("root");

function render() {
  root.innerHTML = "";
  document.documentElement.setAttribute("data-theme", state.settings.theme);
  if (!state.user && state.screen !== "auth") state.screen = "auth";

  const screens = {
    auth: renderAuth, home: renderHome, learn: renderLearn,
    lesson: renderLesson, library: renderLibrary, shop: renderShop,
    ranked: renderRanked, settings: renderSettings
  };
  const fn = screens[state.screen] || renderHome;
  fn();
}

function renderTopbar() {
  return el("div", { class: "topbar" }, [
    el("div", { class: "brand", onclick: () => { state.screen = "home"; render(); } }, [
      el("div", { class: "brand-logo", html: "🦫" }),
      el("div", { style: "display:flex;flex-direction:column;line-height:1.1;" }, [
        el("span", {}, "BOBOR"),
        el("span", { style: "font-size:0.6rem;color:var(--muted);" }, "LINGUO")
      ])
    ]),
    el("div", { class: "stats-group" }, [
      el("div", { class: "stats-pill streak" }, [el("span", {}, "🔥"), el("span", { class: "val" }, String(state.streak))]),
      el("div", { class: "stats-pill" }, [el("span", {}, "⚡"), el("span", { class: "val" }, String(state.xp))]),
      el("button", { class: "icon-btn", html: "⚙️", onclick: () => { state.screen = "settings"; render(); } })
    ])
  ]);
}

function renderAuth() {
  const wrap = el("div", { style: "min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;" });
  wrap.appendChild(el("div", { style: "width:100%;max-width:400px;background:var(--card);padding:36px;border-radius:24px;border:1px solid var(--border);" }, [
    el("h1", { style: "font-size:1.5rem;text-align:center;margin-bottom:8px;" }, "BOBOR-LINGUO"),
    el("p", { style: "text-align:center;color:var(--muted);margin-bottom:24px;" }, "Учи языки с бобром"),
    el("form", {
      onsubmit: (e) => {
        e.preventDefault();
        const username = e.target.username.value.trim();
        if (!username) return;
        state.user = { username };
        state.screen = "home";
        saveState(); render();
      }
    }, [
      el("input", { name: "username", placeholder: "Твой никнейм", style: "width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);margin-bottom:16px;outline:none;" }),
      el("button", { class: "btn btn-primary", type: "submit" }, "Войти")
    ])
  ]));
  root.appendChild(wrap);
}

function renderHome() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("h3", { style: "font-size:0.9rem;color:var(--muted);margin-bottom:8px;" }, "Текущий язык:"));
  const langBar = el("div", { class: "lang-selector" });
  for (const code in COURSES_META) {
    const meta = COURSES_META[code];
    langBar.appendChild(el("div", { 
      class: "lang-btn" + (state.currentCourse === code ? " active" : ""),
      onclick: () => changeLanguage(code)
    }, [el("span", {}, meta.flag), el("span", {}, meta.name)]));
  }
  app.appendChild(langBar);
  app.appendChild(el("h1", { style: "font-size:1.8rem;font-weight:900;margin-bottom:8px;margin-top:20px;" }, "Привет, " + (state.user?.username || "друг") + "!"));
  app.appendChild(el("p", { style: "color:var(--muted);margin-bottom:24px;" }, "Выбери режим"));
  app.appendChild(el("div", { class: "home-grid" }, [
    el("div", { class: "home-card", onclick: () => { state.screen = "learn"; loadCourseData(); } }, [
      el("span", { class: "icon" }, "🎓"), el("h2", {}, "Обучение"), el("p", {}, "Пошаговый путь")
    ]),
    el("div", { class: "home-card", onclick: () => { state.screen = "library"; loadCourseData(); } }, [
      el("span", { class: "icon" }, "📚"), el("h2", {}, "Библиотека"), el("p", {}, "Справочник")
    ]),
    el("div", { class: "home-card", onclick: () => { state.screen = "shop"; render(); } }, [
      el("span", { class: "icon" }, "🛒"), el("h2", {}, "Магазин"), el("p", {}, "Медали и заморозки")
    ]),
    el("div", { class: "home-card", onclick: () => { state.screen = "ranked"; render(); } }, [
      el("span", { class: "icon" }, "🏆"), el("h2", {}, "Ранкед"), el("p", {}, "Лидерборд")
    ])
  ]));
  root.appendChild(app);
}

function renderLearn() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "home"; render(); } })]));
  if (state.loading || !state.courseData) {
    app.appendChild(el("p", { style: "text-align:center;margin-top:40px;" }, "Загрузка курса..."));
    root.appendChild(app); return;
  }
  app.appendChild(el("h1", { style: "font-size:1.6rem;font-weight:900;margin-bottom:4px;text-align:center;" }, "Обучение: " + state.courseData.name));
  app.appendChild(el("p", { style: "color:var(--muted);margin-bottom:24px;text-align:center;" }, "Пройди все юниты, чтобы стать мастером"));
  const path = el("div", { class: "path-container" });
  path.appendChild(el("div", { class: "path-line" }));
  const courseProgress = state.progress[state.currentCourse] || new Set();
  let prevDone = true;
  state.courseData.units.forEach((unit, idx) => {
    const isDone = courseProgress.has(unit.id);
    const isLocked = !prevDone;
    const offsetClass = idx % 2 === 0 ? "offset-left" : "offset-right";
    let icon = "🔒";
    if (isDone) icon = "✅"; else if (!isLocked) icon = "▶️";
    const node = el("div", { 
      class: `path-node ${isLocked ? 'locked' : ''} ${isDone ? 'done' : ''} ${offsetClass}`,
      onclick: () => {
        if (isLocked) return;
        state.currentUnit = unit;
        state.lessonStep = unit.alphabet ? "alphabet_grid" : "words";
        state.quizIdx = 0; state.currentAlphaLetter = null;
        state.screen = "lesson"; render();
      }
    }, [el("span", {}, icon)]);
    node.appendChild(el("div", { style: "position:absolute;top:80px;font-size:0.7rem;font-weight:800;color:var(--muted);white-space:nowrap;" }, unit.title));
    path.appendChild(node);
    prevDone = isDone;
  });
  app.appendChild(path);
  root.appendChild(app);
}

function renderLesson() {
  const unit = state.currentUnit;
  if (!unit) { state.screen = "learn"; render(); return; }
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "learn"; render(); } })]));

  if (state.lessonStep === "alphabet_grid") {
    app.appendChild(el("div", { class: "lesson-header" }, [el("h2", {}, "Алфавит"), el("p", {}, "Нажми на каждую букву, чтобы выучить её")]));
    const grid = el("div", { class: "alpha-grid" });
    const learned = state.alphaProgress[state.currentCourse] || new Set();
    unit.alphabet.table.forEach((a, i) => {
      const isDone = learned.has(i);
      grid.appendChild(el("div", { 
        class: "alpha-btn" + (isDone ? " done" : ""),
        onclick: () => { state.currentAlphaLetter = a; state.lessonStep = "alphabet_card"; render(); }
      }, [
        el("div", {}, a.char),
        el("div", { class: "pair" }, `[${a.sound}]`),
        isDone ? el("div", { class: "check", html: "✓" }) : null
      ]));
    });
    app.appendChild(grid);
    if (learned.size === unit.alphabet.table.length) {
      app.appendChild(el("button", { class: "btn btn-green", onclick: () => { state.lessonStep = "alphabet_quiz"; state.quizIdx = 0; render(); } }, "Пройти тест (50 XP)"));
    } else {
      app.appendChild(el("p", { style: "text-align:center;color:var(--muted);margin-bottom:16px;" }, `Изучено: ${learned.size} из ${unit.alphabet.table.length}`));
    }
  }
  else if (state.lessonStep === "alphabet_card") {
    const a = state.currentAlphaLetter;
    app.appendChild(el("div", { class: "letter-display" }, [
      el("div", { class: "big-char" }, a.char),
      el("div", { class: "sound" }, `Звук: [${a.sound}]`),
      renderAudioButton(a.ex),
      el("div", { class: "example" }, [
        el("div", { class: "word" }, a.ex),
        el("div", { class: "trans" }, "Пример использования")
      ])
    ]));
    app.appendChild(el("button", { class: "btn btn-primary", onclick: () => {
      if (!state.alphaProgress[state.currentCourse]) state.alphaProgress[state.currentCourse] = new Set();
      const idx = unit.alphabet.table.findIndex(x => x.char === a.char);
      state.alphaProgress[state.currentCourse].add(idx);
      saveState(); state.lessonStep = "alphabet_grid"; render();
    } }, "Я выучил эту букву"));
  }
  else if (state.lessonStep === "alphabet_quiz") {
    if (state.quizIdx >= 10) {
      if (state.progress[state.currentCourse] === undefined) state.progress[state.currentCourse] = new Set();
      state.progress[state.currentCourse].add(unit.id);
      state.xp += 50; checkDailyStreak(); saveState();
      app.appendChild(el("div", { class: "success-screen" }, [
        el("div", { class: "emoji" }, "🏆"),
        el("h2", {}, "Алфавит пройден!"),
        el("p", {}, `Ты заработал 50 XP за знание всех букв!`),
        el("button", { class: "btn btn-green", onclick: () => { state.screen = "learn"; render(); } }, "К списку юнитов")
      ]));
      root.appendChild(app); return;
    }
    const randomLetter = unit.alphabet.table[Math.floor(Math.random() * unit.alphabet.table.length)];
    const wrongOptions = unit.alphabet.table.filter(x => x.sound !== randomLetter.sound).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.sound);
    const options = [randomLetter.sound, ...wrongOptions].sort(() => 0.5 - Math.random());
    app.appendChild(el("div", { class: "lesson-header" }, [el("h2", {}, "Тест"), el("p", {}, `Вопрос ${state.quizIdx + 1} из 10`)]));
    app.appendChild(el("div", { style: "font-size:2rem;font-weight:900;text-align:center;margin-bottom:20px;" }, randomLetter.char));
    app.appendChild(el("div", { style: "text-align:center;color:var(--muted);margin-bottom:20px;" }, "Какой звук обозначает эта буква?"));
    options.forEach(opt => {
      const btn = el("div", { class: "quiz-option" }, opt);
      btn.onclick = () => {
        if (btn.classList.contains("disabled")) return;
        document.querySelectorAll(".quiz-option").forEach(b => b.classList.add("disabled"));
        if (opt === randomLetter.sound) btn.classList.add("correct");
        else {
          btn.classList.add("wrong");
          Array.from(document.querySelectorAll(".quiz-option")).forEach(b => {
            if (b.textContent === randomLetter.sound) b.classList.add("correct");
          });
        }
        setTimeout(() => { state.quizIdx++; render(); }, 1000);
      };
      app.appendChild(btn);
    });
  }
  else if (state.lessonStep === "words") {
    app.appendChild(el("div", { class: "lesson-header" }, [el("h2", {}, "Слова"), el("p", {}, unit.title)]));
    const grid = el("div", { class: "word-grid" });
    unit.words.forEach(w => {
      grid.appendChild(el("div", { class: "word-row" }, [
        el("div", {}, [el("div", { class: "w-sr" }, w.sr), el("div", { class: "w-ru" }, w.ru)]),
        renderAudioButton(w.sr)
      ]));
    });
    app.appendChild(grid);
    app.appendChild(el("button", { class: "btn btn-primary", onclick: () => { state.lessonStep = "grammar"; render(); } }, "Дальше: Грамматика"));
  }
  else if (state.lessonStep === "grammar") {
    app.appendChild(el("div", { class: "lesson-header" }, [el("h2", {}, "Грамматика"), el("p", {}, unit.grammar.title)]));
    const box = el("div", { class: "grammar-box" }, [el("h3", {}, unit.grammar.title), el("div", { class: "rule" }, unit.grammar.rules)]);
    unit.grammar.examples.forEach(ex => {
      box.appendChild(el("div", { class: "ex" }, [
        el("div", { style: "display:flex;justify-content:space-between;align-items:center;" }, [el("b", {}, ex.sr), renderAudioButton(ex.sr)]),
        el("span", { style: "color:var(--muted);display:block;margin-top:4px;font-size:0.85rem;" }, ex.ru)
      ]));
    });
    app.appendChild(box);
    app.appendChild(el("button", { class: "btn btn-blue", onclick: () => { state.lessonStep = "quiz"; render(); } }, "Дальше: Тест"));
  }
  else if (state.lessonStep === "quiz") {
    if (state.quizIdx >= 10) {
      if (state.progress[state.currentCourse] === undefined) state.progress[state.currentCourse] = new Set();
      state.progress[state.currentCourse].add(unit.id);
      state.xp += 20; checkDailyStreak(); saveState();
      app.appendChild(el("div", { class: "success-screen" }, [
        el("div", { class: "emoji" }, "🎉"),
        el("h2", {}, "Юнит пройден!"),
        el("p", {}, `Ты заработал 20 XP. Огонек: ${state.streak} 🔥`),
        el("button", { class: "btn btn-green", onclick: () => { state.screen = "learn"; render(); } }, "Вернуться к списку")
      ]));
      root.appendChild(app); return;
    }
    const q = unit.quiz[state.quizIdx];
    app.appendChild(el("div", { class: "lesson-header" }, [el("h2", {}, "Тест"), el("p", {}, `Вопрос ${state.quizIdx + 1} из 10`)]));
    app.appendChild(el("div", { style: "font-size:1.2rem;font-weight:800;margin-bottom:20px;text-align:center;" }, q.q));
    q.options.forEach((opt, i) => {
      const btn = el("div", { class: "quiz-option" }, opt);
      btn.onclick = () => {
        if (btn.classList.contains("disabled")) return;
        document.querySelectorAll(".quiz-option").forEach(b => b.classList.add("disabled"));
        if (i === q.correct) btn.classList.add("correct");
        else {
          btn.classList.add("wrong");
          document.querySelectorAll(".quiz-option")[q.correct].classList.add("correct");
        }
        setTimeout(() => { state.quizIdx++; render(); }, 1000);
      };
      app.appendChild(btn);
    });
  }
  root.appendChild(app);
}

function renderLibrary() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "home"; render(); } })]));
  app.appendChild(el("h1", { style: "font-size:1.6rem;font-weight:900;margin-bottom:4px;" }, "Библиотека"));
  app.appendChild(el("p", { style: "color:var(--muted);margin-bottom:24px;" }, "Только то, что ты уже прошел"));
  if (state.loading || !state.courseData) { root.appendChild(app); return; }
  const courseProgress = state.progress[state.currentCourse] || new Set();
  const doneUnits = state.courseData.units.filter(u => courseProgress.has(u.id));
  if (doneUnits.length === 0) {
    app.appendChild(el("p", { style: "text-align:center;color:var(--muted);margin-top:40px;" }, "Тут пусто. Начни обучение!"));
  } else {
    doneUnits.forEach(u => {
      app.appendChild(el("div", { class: "lib-item" }, [
        el("h4", {}, `${u.icon} ${u.title}`),
        el("div", { style: "margin-top:12px;" }, u.words.slice(0, 3).map(w => 
          el("div", { style: "display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:4px;" }, [el("span", {}, w.sr), el("span", { style: "color:var(--muted);" }, w.ru)])
        )),
        el("p", { style: "margin-top:10px;font-size:0.8rem;" }, u.grammar.title)
      ]));
    });
  }
  root.appendChild(app);
}

function renderShop() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "home"; render(); } })]));
  app.appendChild(el("h1", { style: "font-size:1.6rem;font-weight:900;margin-bottom:24px;" }, "Магазин"));
  const medals = [
    { id: "m1", name: "Обычная", emoji: "🥉", price: 1200 },
    { id: "m2", name: "Деревянная", emoji: "🪵", price: 2000 },
    { id: "m3", name: "Железная", emoji: "⚙️", price: 3400 },
    { id: "m4", name: "Алмазная", emoji: "💎", price: 4000 },
    { id: "m5", name: "Незерит", emoji: "🔥", price: 5000 }
  ];
  const grid = el("div", { class: "shop-grid" });
  medals.forEach(m => {
    const owned = state.medals.includes(m.id);
    grid.appendChild(el("div", { class: "shop-item" + (owned ? " owned" : "") }, [
      el("div", { class: "s-icon" }, m.emoji),
      el("div", { class: "s-name" }, m.name),
      el("div", { class: "s-price" }, `⚡ ${m.price}`),
      el("button", { class: "btn " + (owned ? "btn-ghost" : "btn-primary"), onclick: () => {
        if (owned) return;
        if (state.xp >= m.price) {
          state.xp -= m.price; state.medals.push(m.id); saveState(); render();
        } else alert("Не хватает XP!");
      } }, owned ? "Куплено" : "Купить")
    ]));
  });
  app.appendChild(grid);
  root.appendChild(app);
}

function renderRanked() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "home"; render(); } })]));
  app.appendChild(el("h1", { style: "font-size:1.6rem;font-weight:900;margin-bottom:24px;" }, "Ранкед"));
  const fakeRanks = [
    { name: "Marko", xp: 1500 }, { name: "Ana", xp: 1200 },
    { name: state.user.username, xp: state.xp }, { name: "Ivan", xp: 500 }, { name: "Petar", xp: 200 }
  ].sort((a, b) => b.xp - a.xp);
  fakeRanks.forEach((r, i) => {
    app.appendChild(el("div", { class: "rank-row" + (r.name === state.user.username ? " me" : "") }, [
      el("div", { class: "rank-pos" }, `${i + 1}`),
      el("div", { class: "rank-name" }, r.name),
      el("div", { class: "rank-xp" }, `⚡ ${r.xp}`)
    ]));
  });
  root.appendChild(app);
}

function renderSettings() {
  const app = el("div", { class: "app" });
  app.appendChild(renderTopbar());
  app.appendChild(el("div", { class: "back-bar" }, [el("button", { class: "back-btn", html: "←", onclick: () => { state.screen = "home"; render(); } })]));
  app.appendChild(el("h1", { style: "font-size:1.6rem;font-weight:900;margin-bottom:24px;" }, "Настройки"));
  app.appendChild(el("div", { style: "margin-bottom:20px;padding:20px;background:var(--card);border-radius:16px;" }, [
    el("h3", { style: "font-size:1rem;margin-bottom:8px;" }, "Профиль"),
    el("p", { style: "color:var(--muted);" }, `Никнейм: ${state.user?.username}`),
    el("p", { style: "color:var(--muted);" }, `XP: ${state.xp} · Серия: ${state.streak}`),
    el("button", { class: "btn btn-ghost", style: "margin-top:12px;", onclick: () => { state.user = null; state.screen = "auth"; saveState(); render(); } }, "Выйти")
  ]));
  app.appendChild(el("div", { style: "padding:20px;background:var(--card);border-radius:16px;" }, [
    el("h3", { style: "font-size:1rem;margin-bottom:8px;" }, "Тема"),
    el("button", { class: "btn btn-ghost", onclick: () => {
      state.settings.theme = state.settings.theme === "dark" ? "light" : "dark";
      saveState(); render();
    } }, "Переключить тему")
  ]));
  root.appendChild(app);
}

loadState();
render();
</script>
</body>
</html>
